name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality-check:
    name: 🧪 Quality Gates (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Kiểm tra Lint (oxlint)
        run: npm run lint

      - name: Chạy Unit Tests
        run: npm test -- --forceExit

      - name: Biên dịch NestJS (Build check)
        run: npm run build

  build-and-deploy:
    name: 🚀 Build Docker Image & Deploy Dokploy
    needs: quality-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chuẩn hóa tên image repository viết thường
        id: image-name
        run: |
          REPO_NAME="${{ github.repository }}"
          echo "IMAGE_NAME=ghcr.io/${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tạo Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - name: Build và Push Docker Image lên GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kích hoạt Dokploy Deploy Webhook
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "::error::Secret DOKPLOY_DEPLOY_WEBHOOK_URL chưa được cấu hình trong GitHub Settings!"
            exit 1
          fi

          echo "📡 Đang kích hoạt Dokploy Redeploy qua Webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref }}\"}" \
            "$DOKPLOY_WEBHOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Phản hồi từ Dokploy (HTTP $HTTP_STATUS): $BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Dokploy Webhook trả về lỗi HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi
          echo "✅ Đã kích hoạt Dokploy deploy thành công."

      - name: Post-Deploy Healthcheck
        env:
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL || 'https://api.famidoc.online/health' }}
        run: |
          echo "🩺 Đang kiểm tra trạng thái $HEALTHCHECK_URL ..."
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Backend online (HTTP 200) sau lần thử $i."
              exit 0
            fi
            echo "⏳ Lần $i/25: HTTP $STATUS — chờ 3s..."
            sleep 3
          done
          echo "❌ Backend không phản hồi HTTP 200 sau 75s."
          exit 1

  cleanup-ghcr:
    name: 🧹 Dọn phiên bản GHCR cũ
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Xóa các phiên bản container cũ trên GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: famidoc-backend
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
